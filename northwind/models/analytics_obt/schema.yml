version: 2

models:
  - name: obt_supplier_performance
    description: >
      One Big Table that combines purchase order data with product and supplier information
      and date dimensions for temporal analysis. Enables supplier performance reporting
      including order volumes, costs, delivery timelines, and payment tracking.
    columns:
      - name: purchase_order_id
        description: Unique identifier for the purchase order.
      - name: supplier_id
        description: Identifier of the supplier associated with the purchase order.
      - name: product_id
        description: Identifier of the product ordered.
      - name: quantity
        description: Quantity of the product ordered.
      - name: unit_cost
        description: Cost per unit for the product in this purchase order.
      - name: status_id
        description: Current status of the purchase order.
      - name: creation_date
        description: Date the purchase order was created. Used as the base for date dimension joins.
      - name: submitted_date
        description: Date the purchase order was submitted.
      - name: expected_date
        description: Expected delivery date for the purchase order.
      - name: date_received
        description: Actual date the order was received.
      - name: shipping_fee
        description: Shipping fee associated with the purchase order.
      - name: taxes
        description: Taxes applied to the purchase order.
      - name: payment_date
        description: Date payment was made.
      - name: payment_amount
        description: Amount paid for the purchase order.
      - name: payment_method
        description: Method used for payment.
      - name: approved_by
        description: Employee who approved the purchase order.
      - name: approved_date
        description: Date the purchase order was approved.
      - name: submitted_by
        description: Employee who submitted the purchase order.
      - name: notes
        description: Additional notes for the purchase order.
      - name: product_code
        description: Unique code identifying the product.
      - name: product_name
        description: Name of the product.
      - name: supplier_company
        description: Name of the supplier company providing the product.
      - name: category
        description: Product category.
      - name: standard_cost
        description: Standard cost of the product.
      - name: list_price
        description: List price of the product.
      - name: year
        description: Calendar year of the purchase order creation date.
      - name: fiscal_year
        description: Fiscal year of the purchase order creation date.
      - name: fiscal_qtr
        description: Fiscal quarter of the purchase order creation date.
      - name: month
        description: Month number of the purchase order creation date.
      - name: month_name
        description: Month name of the purchase order creation date.
      - name: year_week
        description: Week number within the year of the purchase order creation date.
      - name: day_name
        description: Day of the week name for the purchase order creation date.
      - name: insertion_timestamp
        description: Timestamp when the record was inserted into this table.
